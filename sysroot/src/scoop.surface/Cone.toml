schema = 1
[cone]
group = "scoop"
name = "scoop.surface"
version = "0.1.0"
kind = "library"

[[sources]]
path = "src/shared"
when = { os = ["darwin", "windows"] }
[[sources]]
path = "src/platform/darwin"
when = { os = "darwin" }
[[sources]]
path = "src/platform/windows"
when = { os = "windows" }

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.math" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop:scoop.graphics" = "0.1.0"
"scoop:scoop.window" = "0.1.0"
[test-dependencies]
"scoop:scoop.test" = "0.1.0"
"scoop:scoop.graphics.text" = "0.1.0"
"scoop.tests:surface-native" = { version = "0.1.0", path = "test-native" }

[[test.sources]]
path = "tests"
when = { os = ["darwin", "windows"] }

[[test.sources]]
path = "tests-darwin"
when = { os = "darwin" }

[native]
cxx = true
cxx_flags = ["-Wmost", "-Wextra", "-Werror", "-Wno-unused-parameter"]
objc_flags = ["-Wall", "-Wextra", "-Werror", "-Wno-unused-parameter"]
[[native.sources]]
path = "native/darwin/renderer.m"
when = { os = "darwin" }
[[native.sources]]
path = "native/windows/device.cpp"
when = { os = "windows" }
[[native.sources]]
path = "native/windows/notifications.cpp"
when = { os = "windows" }
[[native.sources]]
path = "native/windows/surface.cpp"
when = { os = "windows" }
[[native.sources]]
path = "native/windows/frame.cpp"
when = { os = "windows" }
[[native.libraries]]
name = "AppKit"
kind = "framework"
when = { os = "darwin" }
[[native.libraries]]
name = "QuartzCore"
kind = "framework"
when = { os = "darwin" }
[[native.libraries]]
name = "Metal"
kind = "framework"
when = { os = "darwin" }
[[native.libraries]]
name = "d3d12"
when = { os = "windows" }
[[native.libraries]]
name = "dxgi"
when = { os = "windows" }
[[native.libraries]]
name = "dcomp"
when = { os = "windows" }
[[native.libraries]]
name = "user32"
when = { os = "windows" }

[[sources]]
path = "src/shared"
when = { os = "linux", env = "gnu" }

[[sources]]
path = "src/platform/linux"
when = { os = "linux", env = "gnu" }

[[sources]]
path = "src/platform/desktop"
when = { os = "linux", env = "gnu" }

[[sources]]
path = "src/platform/desktop"
when = { os = "darwin" }

[[native.sources]]
path = "native/linux/renderer.c"
when = { os = "linux", env = "gnu" }

[[native.libraries]]
name = "EGL"
kind = "dynamic"
when = { os = "linux", env = "gnu" }

[[native.libraries]]
name = "GLESv2"
kind = "dynamic"
when = { os = "linux", env = "gnu" }

[[native.libraries]]
name = "wayland-egl"
kind = "dynamic"
when = { os = "linux", env = "gnu" }

[[native.libraries]]
name = "wayland-client"
kind = "dynamic"
when = { os = "linux", env = "gnu" }

[[native.libraries]]
name = "xcb"
kind = "dynamic"
when = { os = "linux", env = "gnu" }

[[test.sources]]
path = "tests/animation.scoop"
when = { os = "linux", env = "gnu" }

[[test.sources]]
