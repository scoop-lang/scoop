schema = 1

[cone]
group = "scoop"
name = "scoop.ui.component.tray"
version = "0.1.0"
kind = "library"

[[sources]]
path = "src"
when = { os = ["darwin", "windows"] }
[[sources]]
path = "src"
when = { os = "linux", env = "gnu" }

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.window" = "0.1.0"
"scoop:scoop.tray" = "0.1.0"
"scoop:scoop.ui" = "0.1.0"
"scoop:scoop.ui.component" = "0.1.0"

[test-dependencies]
"scoop:scoop.test" = "0.1.0"
"scoop:scoop.window.asyncio" = "0.1.0"
"scoop:scoop.asyncio" = "0.1.0"

[[test.sources]]
path = "tests"
[[test.sources]]
path = "test-desktop"
when = { os = "darwin" }
[[test.sources]]
path = "test-desktop"
when = { os = "linux", env = "gnu" }
[[test.sources]]
path = "test-windows"
when = { os = "windows" }
