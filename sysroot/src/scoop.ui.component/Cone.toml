schema = 1
[cone]
group = "scoop"
name = "scoop.ui.component"
version = "0.1.0"
kind = "library"

[[sources]]
path = "src"
when = { os = ["darwin", "windows"] }

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.math" = "0.1.0"
"scoop:scoop.charset" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop:scoop.graphics" = "0.1.0"
"scoop:scoop.graphics.text" = "0.1.0"
"scoop:scoop.surface" = "0.1.0"
"scoop:scoop.ui" = "0.1.0"
"scoop:scoop.ui.style" = "0.1.0"
"scoop:scoop.window" = "0.1.0"

[test-dependencies]
"scoop:scoop.ui.style.shadcn" = "0.1.0"
"scoop:scoop.test" = "0.1.0"
"scoop:scoop.ui.style.macos" = "0.1.0"
"scoop:scoop.ui.style.material" = "0.1.0"
"scoop:scoop.ui.style.fluent" = "0.1.0"
"scoop.tests:surface-native" = { version = "0.1.0", path = "../scoop.surface/test-native" }
"scoop.tests:graphics-native" = { version = "0.1.0", path = "../scoop.graphics/test-native" }
"scoop.tests:text-fonts" = { version = "0.1.0", path = "../scoop.graphics.text/tests/data" }

[[test.sources]]
path = "tests"
when = { os = "darwin" }

[[sources]]
path = "src"
when = { os = "linux", env = "gnu" }

