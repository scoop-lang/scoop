schema = 1
[cone]
group = "scoop.examples"
name = "native-desktop"
version = "0.1.0"
kind = "executable"

[[sources]]
path = "src"
when = { os = ["darwin", "windows"] }
[[sources]]
path = "src"
when = { os = "linux", env = "gnu" }
[[sources]]
path = "platform/darwin"
when = { os = "darwin" }
[[sources]]
path = "platform/windows"
when = { os = "windows" }
[[sources]]
path = "platform/linux"
when = { os = "linux", env = "gnu" }

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop:scoop.graphics" = "0.1.0"
"scoop:scoop.graphics.text" = "0.1.0"
"scoop:scoop.surface" = "0.1.0"
"scoop:scoop.ui" = "0.1.0"
"scoop:scoop.ui.style" = "0.1.0"
"scoop:scoop.ui.style.shadcn" = "0.1.0"
"scoop:scoop.ui.component" = "0.1.0"
"scoop:scoop.ui.component.tray" = "0.1.0"
"scoop:scoop.window" = "0.1.0"
"scoop:scoop.tray" = "0.1.0"
"scoop:scoop.window.asyncio" = "0.1.0"
"scoop:scoop.asyncio" = "0.1.0"

[test-dependencies]
"scoop:scoop.test" = "0.1.0"
"scoop.tests:text-fonts" = { version = "0.1.0", path = "../../../scoop.graphics.text/tests/data" }

[[test.sources]]
path = "tests"
when = { os = ["darwin", "windows"] }
[[test.sources]]
path = "tests"
when = { os = "linux", env = "gnu" }

[[test.sources]]
path = "test-windows"
when = { os = "windows" }
