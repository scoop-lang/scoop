schema = 1

[cone]
group = "scoop"
name = "scoop.os.macos"
version = "0.1.0"
kind = "library"

[[sources]]
path = "src"
when = { os = "darwin" }

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"

[test-dependencies]
"scoop:scoop.test" = "0.1.0"
"scoop:scoop.std" = "0.1.0"

[[native.sources]]
path = "native/watch.c"
when = { os = "darwin" }

[[native.sources]]
path = "native/events.c"
when = { os = "darwin" }

[[native.libraries]]
name = "CoreServices"
kind = "framework"
when = { os = "darwin" }

[[native.libraries]]
name = "CoreFoundation"
kind = "framework"
when = { os = "darwin" }
