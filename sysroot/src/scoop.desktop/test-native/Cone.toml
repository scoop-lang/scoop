schema = 1
[cone]
group = "scoop.tests"
name = "desktop-native"
version = "0.1.0"
kind = "library"
[[sources]]
path = "src/shared"
[[sources]]
path = "src/darwin"
when = { os = "darwin" }
[[sources]]
path = "src/windows"
when = { os = "windows" }
[[sources]]
path = "src/linux"
when = { os = "linux", env = "gnu" }
[dependencies]
"scoop:scoop.window" = "0.1.0"
[native]
include = [{ sysroot = "include/gtk", when = { os = "linux", env = "gnu" } }]
c_flags = ["-Wmost", "-Wextra", "-Werror", "-Wno-unused-parameter", "-Wno-nonportable-system-include-path"]
objc_flags = ["-Wall", "-Wextra", "-Werror", "-Wno-unused-parameter"]
[[native.sources]]
path = "native/darwin.m"
when = { os = "darwin" }
[[native.sources]]
path = "native/windows.c"
when = { os = "windows" }
[[native.sources]]
path = "native/linux.c"
when = { os = "linux", env = "gnu" }
