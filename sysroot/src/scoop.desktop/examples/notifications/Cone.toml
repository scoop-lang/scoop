schema = 1
[cone]
group = "scoop.examples"
name = "notification-demo"
version = "0.1.0"
kind = "executable"
[[sources]]
path = "src"
when = { os = ["darwin", "windows"] }
[[sources]]
path = "src"
when = { os = "linux", env = "gnu" }
[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop:scoop.window" = "0.1.0"
"scoop:scoop.desktop" = "0.1.0"
[bundle]
config = "Bundle.toml"
