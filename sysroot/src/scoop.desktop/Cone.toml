schema = 1

[cone]
group = "scoop"
name = "scoop.desktop"
version = "0.1.0"
kind = "library"

[[sources]]
path = "src"
when = { os = ["darwin", "windows"] }
[[sources]]
path = "src"
when = { os = "linux", env = "gnu" }
[[sources]]
path = "platform/darwin"
when = { os = "darwin" }
[[sources]]
path = "platform/windows"
when = { os = "windows" }
[[sources]]
path = "platform/linux"
when = { os = "linux", env = "gnu" }

[[test.sources]]
path = "tests"
when = { os = ["darwin", "windows"] }
[[test.sources]]
path = "tests"
when = { os = "linux", env = "gnu" }

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop:scoop.window" = "0.1.0"

[test-dependencies]
"scoop:scoop.test" = "0.1.0"
"scoop.tests:desktop-native" = { version = "0.1.0", path = "test-native" }

[native]
cxx = true
include = [{ sysroot = "include/gtk", when = { os = "linux", env = "gnu" } }]
c_flags = ["-Wmost", "-Wextra", "-Werror", "-Wno-unused-parameter", "-Wno-nonportable-system-include-path"]
objc_flags = ["-Wall", "-Wextra", "-Werror", "-Wno-unused-parameter"]
cxx_flags = ["-Wmost", "-Wextra", "-Werror", "-Wno-unused-parameter", "-Wno-nonportable-system-include-path"]

[[native.sources]]
path = "native/image.c"
[[native.sources]]
path = "native/no_tasks.c"
when = { os = ["darwin", "linux"] }
[[native.sources]]
path = "native/darwin/desktop.m"
when = { os = "darwin" }
[[native.sources]]
path = "native/windows/desktop.cpp"
when = { os = "windows" }
[[native.sources]]
path = "native/windows/image.cpp"
when = { os = "windows" }
[[native.sources]]
path = "native/windows/tasks.cpp"
when = { os = "windows" }
[[native.sources]]
path = "native/linux/desktop.c"
when = { os = "linux", env = "gnu" }

[[native.libraries]]
name = "AppKit"
kind = "framework"
when = { os = "darwin" }
[[native.libraries]]
name = "CoreFoundation"
kind = "framework"
when = { os = "darwin" }
[[native.libraries]]
name = "comctl32"
when = { os = "windows" }
[[native.libraries]]
name = "shell32"
when = { os = "windows" }
[[native.libraries]]
name = "propsys"
when = { os = "windows" }
[[native.libraries]]
name = "ole32"
when = { os = "windows" }
[[native.libraries]]
name = "uuid"
when = { os = "windows" }
[[native.libraries]]
name = "gtk-4"
kind = "dynamic"
when = { os = "linux", env = "gnu" }
