schema = 1

[cone]
group = "scoop"
name = "scoop.ui.style.macos"
version = "0.1.0"
kind = "library"

[[sources]]
path = "src"

[[sources]]
path = "platform/darwin"
when = { os = "darwin" }

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.graphics" = "0.1.0"
"scoop:scoop.graphics.text" = "0.1.0"
"scoop:scoop.surface" = "0.1.0"
"scoop:scoop.ui.style" = "0.1.0"

[native]
objc_flags = ["-Wall", "-Wextra", "-Werror"]

[[native.sources]]
path = "native/darwin/colors.m"
when = { os = "darwin" }

[[native.libraries]]
name = "AppKit"
kind = "framework"
when = { os = "darwin" }
