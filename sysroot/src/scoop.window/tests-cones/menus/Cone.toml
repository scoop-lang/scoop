schema = 1

[cone]
group = "scoop.tests"
name = "window-menus"
version = "0.1.0"
kind = "library"

[[test.sources]]
path = "tests"
when = { os = ["darwin", "windows", "linux"] }

[[test.sources]]
path = "test-darwin"
when = { os = "darwin" }

[[test.sources]]
path = "test-linux"
when = { os = "linux", env = "gnu" }

[[test.sources]]
path = "test-windows"
when = { os = "windows" }

[test-dependencies]
"scoop:scoop.test" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop:scoop.window" = "0.1.0"

[native]
include = [{ sysroot = "include/gtk", when = { os = "linux", env = "gnu" } }]
c_flags = ["-Wmost", "-Wextra", "-Werror", "-Wno-unused-parameter", "-Wno-nonportable-system-include-path"]
objc_flags = ["-Wall", "-Wextra", "-Werror", "-Wno-unused-parameter"]

[[native.sources]]
path = "native/darwin.m"
when = { os = "darwin" }

[[native.sources]]
path = "native/linux.c"
when = { os = "linux", env = "gnu" }

[[native.sources]]
path = "native/windows.c"
when = { os = "windows" }

[[native.libraries]]
name = "AppKit"
kind = "framework"
when = { os = "darwin" }

[[native.libraries]]
name = "CoreFoundation"
kind = "framework"
when = { os = "darwin" }
