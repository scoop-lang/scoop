schema = 1

[cone]
group = "scoop.tests"
name = "window-watch"
version = "0.1.0"
kind = "library"

[[test.sources]]
path = "tests"
when = { os = "windows" }

[[test.sources]]
path = "test-linux"
when = { os = "linux", env = "gnu" }

[test-dependencies]
"scoop:scoop.test" = "0.1.0"
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop:scoop.window" = "0.1.0"
"scoop:scoop.os.linux" = { version = "0.1.0", when = { os = "linux", env = "gnu" } }

[[native.libraries]]
name = "kernel32"
when = { os = "windows" }
