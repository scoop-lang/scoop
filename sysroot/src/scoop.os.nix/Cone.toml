schema = 1

[cone]
group = "scoop"
name = "scoop.os.nix"
version = "0.1.0"
kind = "library"

[[sources]]
path = "src"
when = { os = ["darwin", "linux"] }

[dependencies]
"scoop:scoop.core" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"

[test-dependencies]
"scoop:scoop.test" = "0.1.0"

[[native.sources]]
path = "native/files.c"
when = { os = ["darwin", "linux"] }
