schema = 1

[cone]
group = "scoop.tests"
name = "ui-accessibility-native"
version = "0.1.0"
kind = "library"

[[sources]]
path = "src"
when = { os = "darwin" }

[dependencies]
"scoop:scoop.window" = "0.1.0"
"scoop:scoop.std" = "0.1.0"

[native]
objc_flags = ["-Wall", "-Wextra", "-Werror", "-Wno-unused-parameter"]

[[native.sources]]
path = "native/accessibility.m"
when = { os = "darwin" }

[[native.sources]]
path = "native/collection.m"
when = { os = "darwin" }

[[native.sources]]
path = "native/collection_actions.m"
when = { os = "darwin" }

[[native.libraries]]
name = "AppKit"
kind = "framework"
when = { os = "darwin" }

[[native.sources]]
path = "native/text_geometry.m"
when = { os = "darwin" }
