schema = 1
[cone]
group = "scoop.tests"
name = "ui-text-drop"
version = "0.1.0"
kind = "library"

[[test.sources]]
path = "tests"
when = { os = "darwin" }

[test-dependencies]
"scoop:scoop.ui" = { version = "0.1.0", path = "../.." }
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.graphics" = "0.1.0"
"scoop:scoop.graphics.text" = "0.1.0"
"scoop:scoop.surface" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop:scoop.window" = "0.1.0"
"scoop:scoop.test" = "0.1.0"
"scoop.tests:text-fonts" = { version = "0.1.0", path = "../../../scoop.graphics.text/tests/data" }

[native]
objc_flags = ["-Wall", "-Wextra", "-Werror", "-Wno-unused-parameter"]

[[native.sources]]
path = "native/drop.m"
when = { os = "darwin" }

[[native.libraries]]
name = "AppKit"
kind = "framework"
when = { os = "darwin" }
