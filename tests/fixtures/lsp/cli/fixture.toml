schema = 1
name = "lsp-command-line-queries"
inputs = ["project", "check.py"]
tools = ["scoop-lsp", "scoop-pm", "python"]
requires_target_execution = false
tags = ["lsp", "cli"]

[[steps]]
name = "prepare"
files = [{copy = {from = "${fixture}/project", to = "${work}/project"}}]

[[steps]]
name = "queries"
argv = ["${python}", "${fixture}/check.py", "${scoop-lsp}", "${scoop-pm}", "${work}/project", "${sysroot}", "${target}"]
exit = 0
stdout = "language service CLI queries passed\n"
stderr = ""
checks = [{file = "${work}/project/target", exists = false}]
