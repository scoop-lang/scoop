schema = 1
name = "check-generator-and-concurrency"
inputs = ["../../generators/build-cache/provider", "../../generators/peer.py"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["driver", "check", "cache"]

[vars]
options = ["--release", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--message-format", "json", "--generator", "test.peer=generator"]

[[steps]]
name = "prepare"
files = [{copy = {from = "${fixture}/../../generators/build-cache/provider", to = "${work}/cone"}}, {concat = {path = "${work}/generator", parts = ["#!${python}\n", {file = "../../generators/peer.py"}]}}, {replace = {path = "${work}/generator", old = "MODE = \"normal\"", new = "MODE = \"cache\""}}, {chmod = {path = "${work}/generator", mode = "755"}}]

[[steps]]
name = "cold"
argv = ["${scoop}", "check", "${work}/cone", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${cold.result.kind}", equals = "check"}, {file = "${work}/generator.calls", equals = "called\n"}, {actual = "${cold.result.observations.child_invocations.length}", equals = 1}, {actual = "${cold.result.observations.child_invocations.0.operation}", equals = "check"}]

[[steps]]
name = "warm"
argv = ["${scoop}", "check", "${work}/cone", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${warm.result.kind}", equals = "check"}, {file = "${work}/generator.calls", equals = "called\ncalled\n"}, {actual = "${warm.result.observations.child_invocations.length}", equals = 1}, {actual = "${warm.result.observations.child_invocations.0.operation}", equals = "check"}]

[[steps]]
name = "generator_change"
files = [{replace = {path = "${work}/generator", old = "return \"{ return 42 }\"", new = "return \"{ return 43 }\""}}]

[[steps]]
name = "changed"
argv = ["${scoop}", "check", "${work}/cone", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${changed.result.kind}", equals = "check"}, {file = "${work}/generator.calls", equals = "called\ncalled\ncalled\n"}, {actual = "${changed.result.observations.child_invocations.length}", equals = 1}, {actual = "${changed.result.observations.child_invocations.0.operation}", equals = "check"}]

[[steps]]
name = "concurrent_input"
files = [{replace = {path = "${work}/generator", old = "return \"{ return 43 }\"", new = "return \"{ return 44 }\""}}]

[[steps]]
name = "first"
argv = ["${scoop}", "check", "${work}/cone", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
background = true

[[steps]]
name = "second"
argv = ["${scoop}", "check", "${work}/cone", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
background = true

[[steps]]
name = "wait_first"
wait = "first"

[[steps]]
name = "wait_second"
wait = "second"

[[steps]]
name = "both_checks_generate"
checks = [{file = "${work}/generator.calls", equals = "called\ncalled\ncalled\ncalled\ncalled\n"}]
