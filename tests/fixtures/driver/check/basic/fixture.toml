schema = 1
name = "check-basic-and-update"
inputs = ["cone", "program.scoop", "../../packages/explicit.scoop"]
tools = ["scoop", "scoopc"]
tags = ["driver", "check", "cache"]

[vars]
options = ["--release", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--message-format", "json"]

[[steps]]
name = "prepare"
files = [{copy = {from = "${fixture}/cone", to = "${work}/cone"}}]

[[steps]]
name = "cold"
argv = ["${scoop}", "check", "${work}/cone", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{file = "${work}/cache/checks-v4", exists = false}, {actual = "${cold.result.kind}", equals = "check"}, {actual = "${cold.result.observations.child_invocations.0.operation}", equals = "check"}, {file = "${work}/cone/target", exists = false}, {glob = "${work}/cache/native-tools-v1/*", equals = []}, {glob = "${work}/cache/native-objects-v1/*", equals = []}, {actual = "${cold.result.observations.child_invocations.length}", equals = 1}]

[[steps]]
name = "warm"
argv = ["${scoop}", "check", "${work}/cone", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${warm.result.kind}", equals = "check"}, {actual = "${warm.result.observations.child_invocations.length}", equals = 1}, {actual = "${warm.result.observations.child_invocations.0.operation}", equals = "check"}]

[[steps]]
name = "test_config"
files = [{replace = {path = "${work}/cone/Cone.toml", old = "checks", new = "other-checks"}}]

[[steps]]
name = "production_unchanged"
argv = ["${scoop}", "check", "${work}/cone", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${production_unchanged.result.kind}", equals = "check"}, {actual = "${production_unchanged.result.observations.child_invocations.length}", equals = 1}, {actual = "${production_unchanged.result.observations.child_invocations.0.operation}", equals = "check"}]

[[steps]]
name = "native_content"
files = [{replace = {path = "${work}/cone/unused.c", old = "invalid C", new = "changed invalid C"}}]

[[steps]]
name = "native_ignored"
argv = ["${scoop}", "check", "${work}/cone", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${native_ignored.result.kind}", equals = "check"}, {actual = "${native_ignored.result.observations.child_invocations.length}", equals = 1}, {actual = "${native_ignored.result.observations.child_invocations.0.operation}", equals = "check"}]

[[steps]]
name = "source_change"
files = [{replace = {path = "${work}/cone/src/main.scoop", old = "42", new = "420"}}]

[[steps]]
name = "changed"
argv = ["${scoop}", "check", "${work}/cone", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${changed.result.kind}", equals = "check"}, {actual = "${changed.result.observations.child_invocations.length}", equals = 1}, {actual = "${changed.result.observations.child_invocations.0.operation}", equals = "check"}]

[[steps]]
name = "new_source"
files = [{write = {path = "${work}/cone/src/extra.scoop", data = "package test.check\nfun extra(): Int = 1\n"}}]

[[steps]]
name = "selection_changed"
argv = ["${scoop}", "check", "${work}/cone", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${selection_changed.result.kind}", equals = "check"}, {actual = "${selection_changed.result.observations.child_invocations.length}", equals = 1}, {actual = "${selection_changed.result.observations.child_invocations.0.operation}", equals = "check"}]

[[steps]]
name = "single"
argv = ["${scoop}", "check", "${fixture}/program.scoop", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${single.result.kind}", equals = "check"}, {actual = "${single.result.observations.child_invocations.length}", equals = 1}, {actual = "${single.result.observations.child_invocations.0.operation}", equals = "check"}]

[[steps]]
name = "single_warm"
argv = ["${scoop}", "check", "${fixture}/program.scoop", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${single_warm.result.kind}", equals = "check"}, {actual = "${single_warm.result.observations.child_invocations.length}", equals = 1}, {actual = "${single_warm.result.observations.child_invocations.0.operation}", equals = "check"}]

[[steps]]
name = "default"
argv = ["${scoop}", "check", {each = "${compile_args}"}, {each = "${options}"}]
cwd = "${work}/cone"
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${default.result.observations.child_invocations.length}", equals = 1}, {actual = "${default.result.observations.child_invocations.0.operation}", equals = "check"}]

[[steps]]
name = "warning"
argv = ["${scoop}", "check", "${fixture}/../../packages/explicit.scoop", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "../../packages/warning.json"}
checks = [{actual = "${warning.result.observations.child_invocations.length}", equals = 1}, {actual = "${warning.result.observations.child_invocations.0.operation}", equals = "check"}]

[[steps]]
name = "warning_rechecked"
argv = ["${scoop}", "check", "${fixture}/../../packages/explicit.scoop", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "../../packages/warning.json"}
checks = [{actual = "${warning_rechecked.result.observations.child_invocations.length}", equals = 1}, {actual = "${warning_rechecked.result.observations.child_invocations.0.operation}", equals = "check"}]
