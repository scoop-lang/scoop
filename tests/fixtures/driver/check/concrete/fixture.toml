schema = 1
name = "check-concrete-condition-and-repair"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
tags = ["driver", "check", "diagnostics", "cache"]

[vars]
options = ["--release", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${work}/cache", "--message-format", "json"]

[[steps]]
name = "prepare"
files = [{copy = {from = "${fixture}/program.scoop", to = "${work}/program.scoop"}}]

[[steps]]
name = "check"
argv = ["${scoop}", "check", "${work}/program.scoop", {each = "${compile_args}"}, {each = "${options}"}]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${work}/program.scoop", {each = "${compile_args}"}, {each = "${options}"}, "-o", "${work}/failed"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}

[[steps]]
name = "repair"
files = [{replace = {path = "${work}/program.scoop", old = 'wrap("managed")', new = 'wrap(42)'}}]

[[steps]]
name = "fixed"
argv = ["${scoop}", "check", "${work}/program.scoop", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${fixed.result.observations.child_invocations.length}", equals = 1}, {actual = "${fixed.result.observations.child_invocations.0.operation}", equals = "check"}]

[[steps]]
name = "warm"
argv = ["${scoop}", "check", "${work}/program.scoop", {each = "${compile_args}"}, {each = "${options}"}]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{actual = "${warm.result.observations.child_invocations.length}", equals = 1}, {actual = "${warm.result.observations.child_invocations.0.operation}", equals = "check"}]
