schema = 1
name = "generator-machine-stderr-is-a-log"
root = "../errors/program.scoop"
inputs = ["../errors/program.scoop", "../peer.py"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["driver", "generator", "protocol"]

[[steps]]
name = "peer"
files = [
  {concat = {path = "${work}/generator", parts = ["#!${python}\n", {file = "../peer.py"}]}},
  {replace = {path = "${work}/generator", old = 'MODE = "normal"', new = 'MODE = "logged"'}},
  {chmod = {path = "${work}/generator", mode = "755"}},
]

[[steps]]
name = "compile"
argv = ["${scoop}", "build", "${root}", {each = "${link_args}"}, "--release", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--generator", "test.peer=generator", "-o", "${work}/program"]
exit = 0
stdout = ""
stderr = {regex = "   Compiling scoop:single-file:0\\.0\\.0\ngenerator log\n    Finished scoop:single-file:0\\.0\\.0 in [0-9]+[.][0-9]{2}s\nbuilt ${work}/program \\(release\\)\n"}

[[steps]]
name = "run"
argv = ["${work}/program"]
exit = 0
stdout = "42\n"
stderr = ""
