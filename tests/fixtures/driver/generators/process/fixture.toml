schema = 1
name = "generator-process-query-and-source"
root = "program.scoop"
inputs = ["program.scoop", "../peer.py"]
tools = ["scoop", "scoopc"]
when = { os = ["darwin", "linux"] }
tags = ["driver", "generator", "protocol"]

[[steps]]
name = "peer"
files = [
  {concat = {path = "${work}/generator", parts = ["#!${python}\n", {file = "../peer.py"}]}},
  {chmod = {path = "${work}/generator", mode = "755"}},
]

[[steps]]
name = "compile"
argv = ["${scoopc}", "build", "${root}", "--profile", "release", {each = "${compile_args}"}, "--sysroot", "${sysroot}", "--direct-slib", "${sysroot}/lib/${target}/scoop.std.slib", "--generator", "test.peer=generator", "--out-slib", "${work}/program.slib", "--emit", "all", "--dump-dir", "${work}/dumps"]
exit = 0
stdout = ""
stderr = "generator: 1 request, 2 owners, 3 methods, queries completed\n"
checks = [
  {file = "${work}/dumps/ast.txt", exists = true},
  {file = "${work}/dumps/hir.txt", exists = true},
  {file = "${work}/dumps/mir.txt", exists = true},
  {file = "${work}/dumps/optimizations.json", exists = true},
  {file = "${work}/dumps/lir.txt", exists = true},
  {file = "${work}/dumps/symbols.json", exists = true},
  {file = "${work}/dumps/generated.scoop", contains = "// Source: generated/function/"},
  {file = "${work}/dumps/generated.scoop", contains = "{\n    val result = left + right\n    return result\n}"},
  {file = "${work}/dumps/generated.scoop", contains = "// 中文前缀\n{ return \"中文\\n\\\"quoted\\\"\" } /* suffix */"},
  {file = "${work}/dumps/generated.scoop", contains = "val decoder: ValueDecoder<T> = T.Companion\n val result: () -> T = { value }\n return result() }"},
]

[[steps]]
name = "link"
argv = ["${scoop}", "link", {each = "${link_args}"}, "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--root-slib", "${work}/program.slib", "--message-format", "json", "-o", "${work}/program"]
exit = 0
stdout = ""
stderr = ""

json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${work}/program"]
exit = 0
stdout = "42\n中文\n\"quoted\"\n7\n5\n"
stderr = ""

[[steps]]
name = "warning_peer"
files = [{replace = {path = "${work}/generator", old = 'MODE = "normal"', new = 'MODE = "warning"'}}]

[[steps]]
name = "warning"
argv = ["${scoopc}", "build", "${root}", "--profile", "release", {each = "${compile_args}"}, "--sysroot", "${sysroot}", "--direct-slib", "${sysroot}/lib/${target}/scoop.std.slib", "--generator", "test.peer=generator", "--out-slib", "${work}/warning.slib"]
exit = 0
stdout = ""
stderr = "warning[GENERATOR_DIAGNOSTIC]: peer diagnostic\n --> ${root}:6:29\n  |\n6 | @GenerateWith(\"test.peer\", [\"Sum\", \"OtherSum\", \"Label\"])\n  |                             ^^^^^\nnote[N0003]: reported by generator `test.peer`\n --> ${root}:6:29\n  |\n6 | @GenerateWith(\"test.peer\", [\"Sum\", \"OtherSum\", \"Label\"])\n  |                             ^^^^^\n"
checks = [{file = "${work}/warning.slib", exists = true}]
