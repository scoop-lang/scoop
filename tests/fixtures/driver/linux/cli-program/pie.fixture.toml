schema = 1
name = "cli-program-musl-pie"
root = "program"
inputs = ["program", "machine"]
tools = ["scoop", "scoopc", "scoop-link", "cc"]
when = { os = "linux", env = "musl" }
tags = ["cli", "eh", "artifact-link", "driver"]
variants = [{"name" = "release", "vars" = {"profile" = "release"}}]
[[steps]]
name = "build"
argv = ["${scoop}", "build", "${root}", {each = "${link_args}"}, "--link-mode", "dynamic", "--profile", "${profile}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "-o", "${work}/program", "--message-format", "json"]
timeout = 300
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []
checks = [{ actual = "${build.result.kind}", equals = "executable" }]

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "Linux ${target_facts.arch}\nGC and EH passed\n"
stderr = ""

[[steps]]
name = "link"
argv = ["${scoop-link}", "--cache-dir", "${cache}", "--sysroot", "${sysroot}", "--root-slib", "${build.result.root.path}", { each = "${build.result.dependencies}", field = "path", prefix = "--dep-slib" }, "--runtime-objects", "${build.result.runtime_index}", {each = "${link_args}"}, "--link-mode", "dynamic", "-o", "${work}/relinked"]
timeout = 300
exit = 0
stdout = "link-plan ${build.result.link_plan_fingerprint}\n"
stderr = ""

[[steps]]
name = "run-relinked"
argv = ["${work}/relinked"]
exit = 0
stdout = "Linux ${target_facts.arch}\nGC and EH passed\n"
stderr = ""

[[steps]]
name = "reject-mixed-libc"
argv = ["${scoop-link}", "--target", "${target_facts.arch}-unknown-linux-gnu", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--root-slib", "${build.result.root.path}", { each = "${build.result.dependencies}", field = "path", prefix = "--dep-slib" }, "-o", "${work}/mixed"]
exit = 1
stdout = ""
stderr = { regex = 'error\[E2404\]: program Link input .+\.slib: target profile identity mismatch: expected org\.scoop-lang\.target-profile/linux-(aarch64|x86-64)-gnu/1, found org\.scoop-lang\.target-profile/linux-\1-musl/1\n' }
checks = [{file = "${work}/mixed", exists = false}]
