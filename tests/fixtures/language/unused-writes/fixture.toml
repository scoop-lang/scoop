schema = 1
name = "local-writes-warnings"
root = "program.scoop"
inputs = ["program.scoop"]
tools = ["scoop", "scoopc"]
tags = ["single-file", "warnings", "language"]

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {"each" = "${link_args}"}, "${root}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {"file" = "warnings.json"}

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "3\n6\n"
stderr = ""
