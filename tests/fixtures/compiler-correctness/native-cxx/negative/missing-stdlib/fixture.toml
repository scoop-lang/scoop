schema = 1
name = "native-cxx-reject-missing-stdlib"
inputs = ["cone"]
tools = ["scoop", "scoopc", "cc"]
targets = ["x86_64-unknown-linux-gnu"]
tags = ["native", "negative", "compiler-correctness"]
[[steps]]
name = "prepare"
files = [{copy = {from = "${fixture}/cone", to = "${work}/cone"}}]

[[steps]]
name = "toolchain"
files = [
{mkdir = {path = "${work}/toolchain"}},
{write = {path = "${work}/toolchain/gcc", data = "#!/bin/sh\nexec \"${cc}\" \"$@\"\n"}},
{chmod = {path = "${work}/toolchain/gcc", mode = "755"}},
{write = {path = "${work}/toolchain/g++", data = "#!/bin/sh\nfor argument in \"$@\"; do\n  if [ \"$argument\" = \"-include\" ]; then echo \"selected GNU toolchain has no libstdc++ development library\" >&2; exit 1; fi\ndone\nexec g++ \"$@\"\n"}},
{chmod = {path = "${work}/toolchain/g++", mode = "755"}}
]

[[steps]]
name = "reject"
argv = ["${scoop}", "build", "--target", "${target}", "--cc", "${work}/toolchain/gcc", "${work}/cone", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 1
stdout = ""
stderr = ""
json = "stderr"
diagnostics = {file = "diagnostics.json"}
