schema = 1
name = "devirtualization-locals"
inputs = ["program.scoop", "../inspect_dispatch.py"]
tools = ["scoop", "python"]
when = { os = ["darwin", "linux"] }
tags = ["devirtualization", "locals", "compiler-correctness"]
variants = [{name = "debug", vars = {profile = "debug"}}, {name = "release", vars = {profile = "release"}}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${fixture}/program.scoop", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--emit", "mir", "--dump-dir", "${work}/dump", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "dispatch"
argv = ["${python}", "${fixture}/../inspect_dispatch.py", "${work}/dump/${build.result.root.identity}/mir.txt", "locals", "${profile}"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "devirtualized locals\n"
stderr = ""
