schema = 1
name = "inlining-decisions"
inputs = ["program.scoop", "../inspect_decisions.py"]
tools = ["scoop", "python"]
when = { os = ["darwin", "linux"] }
tags = ["inlining", "locals", "compiler-correctness"]
variants = [{name = "debug", vars = {profile = "debug"}}, {name = "release", vars = {profile = "release"}}]

[[steps]]
name = "build"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${fixture}/program.scoop", "--profile", "${profile}", "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--emit", "mir", "--dump-dir", "${work}/dump", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "inline-calls"
argv = ["${python}", "${fixture}/../inspect_decisions.py", "${work}/dump/${build.result.root.identity}/mir.txt", "decisions", "${profile}"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "inlined decisions\n"
stderr = ""
