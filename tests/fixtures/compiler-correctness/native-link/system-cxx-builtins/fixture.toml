schema = 1
name = "native-link-system-cxx-builtins"
inputs = ["Cone.toml", "main.scoop", "provider.cpp"]
support = ["../system-archive-builtins/builtins.c"]
tools = ["scoop", "cc"]
targets = ["x86_64-unknown-linux-gnu"]
tags = ["native-link", "compiler-correctness"]

[[steps]]
name = "builtins"
argv = ["${cc}", {each = "${cc_args}"}, "-Wall", "-Wextra", "-Werror", "-c", "${fixture}/../system-archive-builtins/builtins.c", "-o", "${work}/builtins.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive"
argv = ["/usr/bin/ar", "rcs", "${work}/libscoop_test_builtins.a", "${work}/builtins.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "build"
argv = ["${scoop}", "build", "${fixture}", "--release", {each = "${link_args}"}, "--sysroot", "${sysroot}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "native builtins coexist with shared C++ runtime exports\n"
stderr = ""
