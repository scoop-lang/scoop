schema = 1
name = "native-float-environment"
root = "program.scoop"
inputs = ["program.scoop", "native.c", "../../language/callback/threading.h"]
tools = ["scoop", "scoopc", "cc", "ar"]
tags = ["ffi", "abi", "callback", "floating", "compiler-correctness"]
variants = [{ name = "debug", vars = { profile = "debug" } }, { name = "release", vars = { profile = "release" } }]

[[steps]]
name = "native"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-O2", "-Wall", "-Wextra", "-Werror", "-c", "${fixture}/native.c", "-o", "${work}/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive"
argv = ["${ar}", "rcs", "${work}/libfixture_float.a", "${work}/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "build"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${root}", "--profile", "${profile}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--library-path", "${work}", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = "native-float-environment-ok\n"
stderr = ""
