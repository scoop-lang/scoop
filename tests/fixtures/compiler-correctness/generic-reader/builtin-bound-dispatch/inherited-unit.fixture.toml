schema = 1
name = "generic-reader-inherited-unit-bound"
inputs = ["provider", "consumer", "checks/equality.scoop", "inherited-unit.scoop"]
tools = ["scoop", "scoopc"]
tags = ["generic-reader", "cross-cone", "compiler-correctness"]

# Unit keeps its own equals implementation, but reaches Equals<Unit> through
# a child interface. The consumer discovers the parent slot in a default argument.
[[steps]]
name = "prepare"
files = [
  {copy = {from = "${sysroot}/src/scoop.core", to = "${work}/core"}},
  {replace = {path = "${work}/core/src/unit.scoop", old = "public struct Unit : Equals<Unit>", new = "public struct Unit : UnitEquality"}},
  {write = {path = "${work}/core/src/unit_equality.scoop", data = "public interface UnitEquality : Equals<Unit> {}\n"}},
  {copy = {from = "${fixture}/provider", to = "${work}/provider"}},
  {copy = {from = "${fixture}/checks/equality.scoop", to = "${work}/provider/src/check.scoop"}},
  {copy = {from = "${fixture}/inherited-unit.scoop", to = "${work}/provider/src/wrapper.scoop"}},
  {copy = {from = "${fixture}/consumer", to = "${work}/consumer"}},
]

[[steps]]
name = "core"
argv = ["${scoop}", "build", "--release", {each = "${link_args}"}, "${work}/core", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-core", "--message-format", "json", "-o", "${work}/artifacts/scoop/scoop.core/0.1.0/cone.slib"]
timeout = 900
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "build"
argv = ["${scoop}", "build", "--release", {each = "${link_args}"}, "${work}/consumer", "--cone-path", "${work}/artifacts", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${build.result.output}"]
exit = 0
stdout = ""
stderr = ""
