schema = 1
name = "small-values-artifacts"
inputs = ["provider", "consumer", "../inspect_abi.py"]
tools = ["scoop", "scoopc", "scoop-link", "python"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
tags = ["abi", "generics", "compiler-correctness"]
variants = [{"name" = "debug", "vars" = {"profile" = "debug", "provider_profile" = "release", "symbol_args" = ["--keep-symbols", "--emit-debug-file"], "stack_trace" = "true"}}, {"name" = "release", "vars" = {"profile" = "release", "provider_profile" = "debug", "symbol_args" = [], "stack_trace" = "false"}}]

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${fixture}/provider", to = "${work}/sources/provider"}},
  {copy = {from = "${fixture}/consumer", to = "${work}/sources/consumer"}},
]

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/provider", "--profile", "${provider_profile}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--message-format", "json", "-o", "${work}/artifacts/dev.m34/small-provider/0.1.0/cone.slib", "--emit", "all", "--dump-dir", "${work}/dump"]
timeout = 300
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "provider-abi"
argv = ["${python}", "${fixture}/../inspect_abi.py", "provider", "${work}/dump/${provider.result.root.identity}", "${work}/provider.abi.txt"]
exit = 0
stdout = ""
stderr = ""
checks = [
  {file = "${work}/provider.abi.txt", snapshot = "provider.${target_facts.arch}.abi.txt"},
]

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {"each" = "${link_args}"}, "${work}/sources/consumer", "--profile", "${profile}", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--message-format", "json", "--emit", "all", "--dump-dir", "${work}/dump", "-o", "${work}/programs/consumer/program"]
timeout = 300
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "consumer-abi"
argv = ["${python}", "${fixture}/../inspect_abi.py", "consumer", "${work}/dump/${consumer.result.root.identity}", "${work}/consumer.abi.txt"]
exit = 0
stdout = ""
stderr = ""
checks = [
  {file = "${work}/consumer.abi.txt", snapshot = "consumer.${target_facts.arch}.abi.txt"},
]

[[steps]]
name = "link"
argv = ["${scoop-link}", {"each" = "${link_args}"}, "--root-slib", "${consumer.result.root.path}", {"each" = "${consumer.result.dependencies}", "field" = "path", "prefix" = "--dep-slib"}, "--runtime-objects", "${consumer.result.runtime_index}", "-o", "${work}/programs/link/program", "--cache-dir", "${cache}", "--sysroot", "${sysroot}", {"each" = "${symbol_args}"}, "--enable-stack-trace=${stack_trace}"]
exit = 0
stdout = "link-plan ${consumer.result.link_plan_fingerprint}\n"
stderr = ""

[[steps]]
name = "run"
argv = ["${work}/programs/link/program"]
exit = 0
stdout = "small artifacts\n"
stderr = ""
