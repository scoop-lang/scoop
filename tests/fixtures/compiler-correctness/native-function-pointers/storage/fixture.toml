schema = 1
name = "native-function-pointer-storage"
inputs = ["provider", "consumer", "native.c"]
tools = ["scoop", "scoopc", "cc", "ar"]
tags = ["ffi", "native-function-pointers", "compiler-correctness"]

[[steps]]
name = "prepare"
files = [
  {copy = {from = "${fixture}/provider", to = "${work}/sources/provider"}},
  {copy = {from = "${fixture}/consumer", to = "${work}/sources/consumer"}},
]

[[steps]]
name = "native"
argv = ["${cc}", {each = "${cc_args}"}, "-std=c11", "-O2", "-Wall", "-Wextra", "-Werror", "-c", "${fixture}/native.c", "-o", "${work}/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "archive"
argv = ["${ar}", "rcs", "${work}/libfixture_native.a", "${work}/native.o"]
exit = 0
stdout = ""
stderr = ""

[[steps]]
name = "provider"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/provider", "--release", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-provider", "--library-path", "${work}", "--message-format", "json", "-o", "${work}/artifacts/dev.nativepointers/storage-provider/0.1.0/cone.slib"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "consumer"
argv = ["${scoop}", "build", {each = "${link_args}"}, "${work}/sources/consumer", "--release", "--sysroot", "${sysroot}", "--scoopc", "${scoopc}", "--cache-dir", "${cache}", "--target-dir", "${work}/target-consumer", "--cone-path", "${work}/artifacts", "--library-path", "${work}", "--message-format", "json"]
exit = 0
stdout = ""
stderr = ""
json = "stderr"
diagnostics = []

[[steps]]
name = "run"
argv = ["${consumer.result.output}"]
exit = 0
stdout = "native-pointer-storage-ok\n"
stderr = ""
