schema = 1

[cone]
group = "dev.scoop.bundle"
name = "gui-app"
version = "1.0.0"
kind = "executable"
description = "A Scoop window reading an installed resource"
license = "UNLICENSED"

[dependencies]
"scoop:scoop.std" = "0.1.0"
"scoop:scoop.platform" = "0.1.0"
"scoop:scoop.window" = "0.1.0"

[bundle]
schema = 1
identifier = "dev.scoop.gui-app"
display-name = "Scoop Bundle Window"
publisher = "Scoop Examples"
icons = ["../resources/assets/icon.png"]

[[bundle.files]]
from = "../resources/assets"
to = "assets"
kind = "resource"

[bundle.macos]
formats = ["app"]

[bundle.linux]
formats = ["deb", "rpm", "appimage"]
categories = ["Utility"]

[bundle.linux.deb]
maintainer = "Scoop Examples <noreply@example.com>"
depends = ["libgtk-4-1 (>= 4.18)", "libadwaita-1-0 (>= 1.4)"]

[bundle.linux.rpm]
requires = ["gtk4 >= 4.18", "libadwaita >= 1.4"]
