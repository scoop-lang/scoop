schema = 1

[cone]
group = "dev.scoop.bundle"
name = "resource-app"
version = "1.0.0"
kind = "executable"
description = "A Scoop application reading a packaged resource"
license = "UNLICENSED"

[dependencies]
"scoop:scoop.platform" = "0.1.0"

[bundle]
schema = 1
identifier = "dev.scoop.resource-app"
display-name = "Scoop Resource App"
publisher = "Scoop Examples"
icons = ["assets/icon.png"]

[[bundle.files]]
from = "assets"
to = "assets"
kind = "resource"

[bundle.macos]
formats = ["app"]

[bundle.linux]
formats = ["deb", "rpm", "appimage"]
terminal = true

[bundle.linux.deb]
maintainer = "Scoop Examples <noreply@example.com>"

[bundle.windows]
formats = ["nsis", "msi"]
vc-runtime = "system"

[bundle.windows.msi]
upgrade-code = "7c64998b-c73c-56bf-9b8b-63a4e06fd661"
